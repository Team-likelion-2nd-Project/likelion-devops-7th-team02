stages:
  - build
  - test

frontend-build:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

backend-test:
  stage: test
  image: gradle:8.14-jdk21
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew test --no-daemon

backend-build:
  stage: build
  image: gradle:8.14-jdk21
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew clean bootJar -x test --no-daemon
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 day
