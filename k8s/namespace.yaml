# DevFlow 애플리케이션 Namespace
#
# 이 파일의 범위: 애플리케이션 Namespace 하나만 정의한다.
#   Namespace/monitoring        -> 이 단계에서 생성하지 않음 (Monitoring 단계)
#   Namespace/external-dns      -> k8s/controllers/external-dns/namespace.yaml
#   kube-system                 -> 기존에 존재 (LBC, Metrics Server)
#
# 대상 클러스터(아직 미배포): devflow-dev-eks, ap-northeast-1, k8s 1.36
# 설치 방식: kubectl + YAML manifest 만 사용한다. Helm 은 사용하지 않는다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: devflow
  labels:
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
