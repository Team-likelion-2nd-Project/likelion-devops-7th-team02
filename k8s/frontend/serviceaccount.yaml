# ServiceAccount/frontend-sa  (Namespace: devflow)
#
# Frontend workload 는 정적 파일을 서빙하는 nginx 서버다
# (frontend/Dockerfile 의 2단계 stage). Kubernetes API 도, AWS API 도 호출하지
# 않으므로 다음을 사용하지 않는다.
#   * IRSA 없음                     (eks.amazonaws.com/role-arn annotation 없음)
#   * Role / RoleBinding 없음       (Kubernetes API 권한 자체가 없음)
#   * 어떤 형태의 AWS 자격증명도 없음
#
# automountServiceAccountToken: false
#   안전함을 확인했다. frontend/ 어디에서도
#   /var/run/secrets/kubernetes.io/serviceaccount 를 읽지 않는다. projected
#   token 을 끄면 Pod 파일시스템에서 자격증명 하나가 사라질 뿐 기능 손실은 없다.
#   docs/architecture.md:134 ("frontend-sa: Kubernetes API 권한 없음")와 일치한다.
#
# 중복 정의 주의
#   docs/kubernetes_resource_list.md 는 ServiceAccount 의 위치로
#   k8s/rbac/serviceaccounts.yaml 을 제시하지만, frontend-sa 는 이 파일이
#   소유한다(frontend manifest 소속). k8s/rbac/serviceaccounts.yaml 에서
#   frontend-sa 를 다시 정의하면 안 된다. 그 파일은 gitlab-deployer 만 담당한다
#   (backend-sa 도 backend 단계가 소유하지 않는 경우에만 포함).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: devflow
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
