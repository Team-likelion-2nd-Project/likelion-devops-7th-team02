# ConfigMap/frontend-config  (Namespace: devflow)
#
# 이 ConfigMap 이 비어 있는 이유 (data: {})
#
# Frontend 컨테이너는 runtime 환경변수를 전혀 사용하지 않는다. frontend/ 의
# 실제 소스를 확인한 결과는 다음과 같다.
#
#   * frontend/src/api/axios.js:4
#       baseURL: import.meta.env.VITE_API_BASE_URL
#     `import.meta.env.*` 는 `vite build` 시점에 Vite 가 정적으로 치환하므로
#     값이 BUILD 시점에 JS 번들 안에 그대로 박힌다.
#
#   * frontend/Dockerfile:11-12
#       ARG VITE_API_BASE_URL
#       ENV VITE_API_BASE_URL=$VITE_API_BASE_URL
#     값은 build stage(node:20-alpine)에서 docker build argument 로 주입된다.
#     즉 nginx runtime stage 가 만들어지기 전에 결정된다.
#
#   * frontend/src/api/healthApi.js:4
#       axios.get('/actuator/health')     <- 상대 경로, same-origin 요청
#
#   * frontend/nginx.conf
#       SPA fallback 이 붙은 `location /` 하나뿐이다. /api 나 /actuator 용
#       proxy_pass 가 없으므로 nginx 도 runtime 설정값을 읽지 않는다.
#
# 결론: 여기에 값을 넣어 Pod env(envFrom/env)로 주입해도 브라우저가 실제로
# 사용하는 값은 바뀌지 않는다. 따라서
#   - `data` 는 의도적으로 비워 둔다
#   - Deployment 도 의도적으로 이 ConfigMap 을 참조하지 않는다
#     (envFrom / configMapRef 없음)
#
# Backend URL 이 실제로 결정되는 방식
#   Build 시점: docker build --build-arg VITE_API_BASE_URL=... ./frontend
#   Runtime   : axios.js(VITE_API_BASE_URL 이 비어 있을 때)와 healthApi.js 가
#               모두 same-origin 상대 경로로 요청하므로 라우팅은 Ingress 책임이다.
#                 /            -> frontend-service
#                 /api/*       -> backend-service
#                 /actuator/health* -> backend-service
#               (Ingress 는 이후 단계이며 여기서 생성하지 않는다.)
#
# 이후 runtime-config 메커니즘(예: /usr/share/nginx/html/config.js 를 렌더링하는
# entrypoint, 또는 envsubst 를 쓰는 nginx template)이 추가된다면, 그때 비로소
# 여기에 key 를 추가하고 Deployment 에서 mount/참조하도록 한다. 그 메커니즘이
# 없는 상태에서 미리 key 를 추가하지 않는다.
#
# 이 ConfigMap 에는 Secret 값이 없다. AWS 값(ACM/IAM/RDS)도 넣지 않는다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: devflow
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
data: {}
