# 예시 파일 전용 - Secret/gitlab-registry-secret  (Namespace: devflow)
#
# 이 파일에는 실제 자격증명이 없으며, 앞으로도 절대 넣으면 안 된다.
# 이 파일을 그대로 `kubectl apply` 하지 않는다. placeholder 만 들어 있다.
#
# Runtime 리소스 계약
#   이름      : gitlab-registry-secret
#   Namespace : devflow
#   Type      : kubernetes.io/dockerconfigjson
#   사용처    : Deployment/frontend, Deployment/backend 의
#               spec.template.spec.imagePullSecrets[].name
#   Registry  : team02-gitlab.manoit.co.kr:5050
#               (이미지 경로 규칙은 .gitlab-ci.yml:47/56 참고 ->
#                $CI_REGISTRY_IMAGE/{frontend,backend}:$CI_COMMIT_SHORT_SHA)
#
# ============================================================================
# 권장: 실제 Secret 은 Git 파일이 아니라 명령형으로 생성한다.
# 개인 비밀번호가 아니라 GitLab Deploy Token(scope: read_registry)을 사용한다.
#
#   kubectl create secret docker-registry gitlab-registry-secret \
#     --namespace devflow \
#     --docker-server=team02-gitlab.manoit.co.kr:5050 \
#     --docker-username='<GITLAB_DEPLOY_TOKEN_USERNAME>' \
#     --docker-password='<GITLAB_DEPLOY_TOKEN>' \
#     --docker-email='<TEAM_EMAIL>'
#
# 확인 (비밀 값을 출력하지 않는 방법):
#   kubectl -n devflow get secret gitlab-registry-secret \
#     -o jsonpath='{.type}{"\n"}'
#
# base64 는 인코딩이지 암호화가 아니다. 실제 .dockerconfigjson 값은 base64 로
# 인코딩했더라도 절대 커밋하지 않는다.
# ============================================================================
#
# 아래 manifest 는 결과물의 형태만 문서화한 것이다.
# <DOCKER_CONFIG_JSON> 은 다음 내용을 base64 로 인코딩한 값에 해당한다.
#   {"auths":{"team02-gitlab.manoit.co.kr:5050":{"username":"...","password":"...","auth":"..."}}}
# 그 값을 Git 에 넣는 것이 바로 이 프로젝트가 금지하는 행위다.
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-secret
  namespace: devflow
  labels:
    app.kubernetes.io/name: gitlab-registry-secret
    app.kubernetes.io/component: registry-credentials
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <DOCKER_CONFIG_JSON>
