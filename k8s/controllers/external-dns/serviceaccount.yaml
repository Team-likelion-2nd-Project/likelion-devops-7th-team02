# ExternalDNS - ServiceAccount (IRSA)
#
# 프로젝트 계약
#   EKS 클러스터   : devflow-dev-eks   (Kubernetes 1.36, ap-northeast-1)
#   Namespace      : external-dns
#   ServiceAccount : external-dns
#   IRSA subject   : system:serviceaccount:external-dns:external-dns
#
# Terraform 계약 (terraform/modules/external-dns-iam)
#   IAM Role 이름    : devflow-dev-external-dns-role
#   IAM Policy 이름  : devflow-dev-external-dns-policy
#   Terraform output : external_dns_role_arn  (environments/dev)
#   Trust 조건       : oidc ...:sub == system:serviceaccount:external-dns:external-dns
#                      oidc ...:aud == sts.amazonaws.com
#   Route53 범위     : ChangeResourceRecordSets 가 team02-app.manoit.co.kr 로 제한됨
#                      (team02-gitlab.manoit.co.kr 은 ExternalDNS 관리 대상이 아님)
#
# 상태: AWS 인프라가 아직 배포되지 않았다.
#   아래 role-arn 은 의도적인 placeholder 이다.
#   `terraform apply` 이후 <EXTERNAL_DNS_IAM_ROLE_ARN> 을 다음 값으로 교체한다.
#       terraform -chdir=terraform/environments/dev output -raw external_dns_role_arn
#   AWS Account ID 나 ARN 을 추측해서 채우지 않는다.
#
# 보안: AWS 접근 권한은 오직 IRSA 로만 획득한다.
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN 없음,
#   static credential Secret 없음, Node instance-profile 의존 없음.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
  annotations:
    eks.amazonaws.com/role-arn: "<EXTERNAL_DNS_IAM_ROLE_ARN>"
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: true
