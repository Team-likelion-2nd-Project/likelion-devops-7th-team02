# ExternalDNS - 전용 Namespace
#
# 프로젝트 계약
#   EKS 클러스터 : devflow-dev-eks   (Kubernetes 1.36, ap-northeast-1)
#   Namespace    : external-dns
#
# 이 Namespace 이름은 terraform/modules/external-dns-iam 에 정의된 IRSA trust
# 계약의 일부이다.
#   sub == system:serviceaccount:external-dns:external-dns
# Namespace 이름을 바꾸면 IAM Role 의 trust policy 가 깨진다.
#
# 설치 방식: kubectl + YAML manifest 만 사용한다. Helm 은 사용하지 않는다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
