# AWS Load Balancer Controller - ServiceAccount (IRSA)
#
# 프로젝트 계약
#   Controller 버전    : v2.14.1
#   EKS 클러스터       : devflow-dev-eks   (Kubernetes 1.36, ap-northeast-1)
#   Namespace          : kube-system
#   ServiceAccount     : aws-load-balancer-controller
#   IRSA subject       : system:serviceaccount:kube-system:aws-load-balancer-controller
#
# Terraform 계약 (terraform/modules/alb-controller-iam)
#   IAM Role 이름      : devflow-dev-aws-load-balancer-controller-role
#   IAM Policy 이름    : devflow-dev-aws-load-balancer-controller-policy
#   Terraform output   : alb_controller_role_arn  (environments/dev)
#   Trust 조건         : oidc ...:sub == system:serviceaccount:kube-system:aws-load-balancer-controller
#                        oidc ...:aud == sts.amazonaws.com
#
# 상태: AWS 인프라가 아직 배포되지 않았다.
#   아래 role-arn 은 의도적인 placeholder 이다.
#   `terraform apply` 이후 <ALB_CONTROLLER_IAM_ROLE_ARN> 을 다음 값으로 교체한다.
#       terraform -chdir=terraform/environments/dev output -raw alb_controller_role_arn
#   AWS Account ID 나 ARN 을 추측해서 채우지 않는다.
#
# 참고: 이 파일에는 프로젝트가 소유하는 ServiceAccount 만 들어 있다.
#   전체 Controller manifest(CRD, RBAC, Deployment, Webhook, Service)는 여기에
#   포함하지 않는다. 실제 배포 시 공식 upstream v2.14.1 manifest 를 사용하고,
#   해당 manifest 에 포함된 ServiceAccount 가 이 파일을 덮어쓰지 않도록 주의한다.
#   (덮어썼다면 이 파일을 다시 apply 해서 IRSA annotation 이 남도록 한다.)
#
# 설치 방식: kubectl + YAML manifest 만 사용한다. Helm 은 사용하지 않는다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: v2.14.1
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
  annotations:
    eks.amazonaws.com/role-arn: "<ALB_CONTROLLER_IAM_ROLE_ARN>"
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: true
