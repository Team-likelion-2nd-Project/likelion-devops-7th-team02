# Service/backend-service  (Namespace: devflow)
#
# ClusterIP 전용. 외부 노출은 이 Service 의 역할이 아니다.
#   Ingress/devflow-ingress -> AWS Load Balancer Controller -> ALB -> backend-service
#   (k8s/ingress/ingress.yaml 이 "/actuator/health" 와 "/api" 를 여기로
#    라우팅한다. 둘 다 pathType: Prefix)
# type: LoadBalancer 는 의도적으로 사용하지 않는다.
#
# 포트 매핑
#   Service port 8080 -> targetPort "http" -> container port 8080
#   (Deployment/backend 의 이름 있는 포트. backend/Dockerfile:25 EXPOSE 8080,
#    application.yml:17 server.port: ${SERVER_PORT:8080})
#
# /actuator/prometheus 도 같은 포트에서 접근 가능하며 클러스터 내부 Prometheus
# scrape 용으로 사용한다. docs/architecture.md:95 에 따라 public Ingress 로는
# 공개하지 않으며 Ingress 에도 해당 경로가 없다. 이를 위한 별도 Service 포트는
# 필요하지 않다.
#
# selector 는 Deployment/backend 의 Pod template label 과 정확히 일치해야 한다: app=backend
#
# ALB TARGET GROUP HEALTH CHECK
#   Ingress 가 아니라 Service 에 설정한다. Frontend Target Group 은 "/" 가
#   필요하고 이쪽은 "/actuator/health" 가 필요하므로, Ingress 레벨에 공용
#   healthcheck-path 를 두면 둘 중 하나가 깨진다. AWS Load Balancer Controller 는
#   Target Group 범위 annotation 을 backend Service 에서 읽는다.
#   /actuator/health 는 실제로 존재하고 인증이 필요 없다. actuator 노출 설정이
#   include: health,prometheus (application.yml:34) 이고
#   /actuator/health/** 가 permitAll (SecurityConfig.java:43-50) 이다.
#   UP 이면 200, DOWN 이면 503 을 반환하므로 Target Group 동작으로 정확히 적합하다.
#   healthcheck-path 만 지정한다. 나머지는 Controller 기본값이 이미 맞다:
#   protocol HTTP, port traffic-port, success-codes 200.
#   Pod 자체 probe 는 의도적으로 더 세분화된
#   /actuator/health/{liveness,readiness} 그룹을 사용한다. ALB 에는 전체 health
#   상태만 있으면 된다.
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devflow
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
