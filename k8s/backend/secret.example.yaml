# 예시 파일 전용 - Secret/backend-secret  (Namespace: devflow)
#
# 이 파일에는 실제 Secret 값이 없으며, 앞으로도 절대 넣으면 안 된다.
# 이 파일을 그대로 `kubectl apply` 하지 않는다. placeholder 만 들어 있다.
#
# key 는 애플리케이션이 실제로 읽는 변수와 정확히 같다(backend/ 에서 확인).
#   DB_USERNAME  application-dev.yml:4 / application-prod.yml:4
#                spring.datasource.username: ${DB_USERNAME}
#   DB_PASSWORD  application-dev.yml:5 / application-prod.yml:5
#                spring.datasource.password: ${DB_PASSWORD}
#   JWT_SECRET   application.yml:27  jwt.secret: ${JWT_SECRET:...}
#                backend/src/main/java/com/devflow/global/jwt/
#                JwtTokenProvider.java:19-24 에서 Keys.hmacShaKeyFor(secret bytes)로 사용
#
# JWT_SECRET 제약 (실제 제약이며 위반 시 Pod 가 기동 실패한다):
#   JwtTokenProvider 가 원본 UTF-8 바이트를 Keys.hmacShaKeyFor() 에 그대로
#   넘기므로, jjwt 는 HS256 에 최소 32바이트(256비트)를 요구한다. 더 짧으면
#   기동 시 WeakKeyException 이 발생한다. 32자 이상의 랜덤 값을 사용한다.
#   application.yml:27 의 로컬 기본값은 개발 전용이며 EKS 의 dev/prod 에서
#   절대 재사용하지 않는다.
#
# DB_USERNAME/DB_PASSWORD 는 Terraform 이 생성한 RDS master 자격증명과 일치해야
# 한다 (terraform/modules/rds/main.tf:28-29. 변수 db_username 의 현재 기본값은
# "dbadmin" 이고, db_password 는 기본값이 없는 sensitive 변수다).
#
# ============================================================================
# 권장: 실제 Secret 은 Git 이 아니라 명령형으로, 별도 경로로 생성한다.
#
#   kubectl create secret generic backend-secret \
#     --namespace devflow \
#     --from-literal=DB_USERNAME='<DB_USERNAME>' \
#     --from-literal=DB_PASSWORD='<DB_PASSWORD>' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# 값을 출력하지 않고 확인하는 방법:
#   kubectl -n devflow get secret backend-secret -o jsonpath='{.data}' | \
#     tr ',' '\n' | cut -d'"' -f2
#
# 로테이션: Secret 을 다시 만든 뒤 workload 를 재시작한다.
#   kubectl -n devflow rollout restart deployment/backend
#   (envFrom 값은 Pod 시작 시 주입되며 실시간으로 갱신되지 않는다.)
#
# base64 는 인코딩이지 암호화가 아니다. 실제 값은 base64 로 인코딩했더라도 절대
# 커밋하지 않는다. Secret 을 반드시 Git 에 두어야 한다면 Sealed Secrets /
# External Secrets Operator / SSM Parameter Store 를 검토한다.
# ============================================================================
#
# 아래 manifest 는 결과물의 형태만 문서화한 것이다. 누군가 base64 를 붙여 넣고
# "가려졌다"고 착각하지 않도록 `stringData` 를 사용했다.
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devflow
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  DB_USERNAME: "<DB_USERNAME>"
  DB_PASSWORD: "<DB_PASSWORD>"
  # HS256 요구사항: 32자(256비트) 이상
  JWT_SECRET: "<JWT_SECRET>"
