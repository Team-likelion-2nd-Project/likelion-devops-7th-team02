# Deployment/backend  (Namespace: devflow)
#
# Source of truth: backend/ 의 실제 애플리케이션 소스
#   Spring Boot      : 3.5.4                     backend/build.gradle:3
#   Java             : 21 (toolchain)            backend/build.gradle:10-14
#   Build            : Gradle 9.7 wrapper -> bootJar
#   Image            : multi-stage, eclipse-temurin:21-jdk 빌드 ->
#                      eclipse-temurin:21-jre 런타임        backend/Dockerfile
#   Runtime 명령     : ENTRYPOINT ["java","-jar","app.jar"]  (WORKDIR /app)
#   컨테이너 포트    : 8080  Dockerfile:25 EXPOSE 8080 및
#                            application.yml:17 server.port: ${SERVER_PORT:8080}
#                            (프로젝트 계약과 일치 - 충돌 없음)
#   Datasource       : ${DB_URL}/${DB_USERNAME}/${DB_PASSWORD} 로 PostgreSQL 연결
#                      application-dev.yml:3-6, application-prod.yml:3-6
#   Actuator         : spring-boot-starter-actuator (build.gradle:25),
#                      노출 설정 include: health,prometheus (application.yml:34),
#                      health probe 활성화 (application.yml:36-46)
#   공개 endpoint    : /actuator/health/**, /actuator/prometheus 가 permitAll
#                      backend/src/.../global/security/SecurityConfig.java:43-50
#
# IMAGE - 의도적인 placeholder 이며 추측해서 채우지 않는다.
#   CI 가 빌드/푸시하는 이름 (.gitlab-ci.yml:56-57):
#     $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
#   실제로 풀어 쓰면:
#     team02-gitlab.manoit.co.kr:5050/<gitlab-group>/<gitlab-project>/backend:<commit-short-sha>
#   GitLab group/project 경로는 이 저장소만으로 알 수 없고 tag 는 커밋별 short
#   SHA 이므로, 배포 시점에 실제로 푸시된 참조로 <BACKEND_IMAGE> 를 교체한다.
#   `latest` 는 의도적으로 사용하지 않는다.
#
# 기동 선행 조건 (충족되지 않으면 Pod 가 기동 실패한다):
#   dev/prod profile 은 ddl-auto: validate 를 사용하고 Flyway/Liquibase 가 없다.
#   따라서 RDS 에 users / projects / project_members / tasks 테이블이 이미 있어야
#   한다. k8s/backend/configmap.yaml 의 설명 참고.
#
# 상태: AWS/EKS/RDS runtime 이 아직 없다. 어디에도 apply 되지 않았다.
# 설치 방식: kubectl + YAML manifest 만 사용한다. Helm 은 사용하지 않는다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devflow
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
spec:
  # replicas 2: docs/architecture.md:85 및 node group desired=2 기준.
  # HorizontalPodAutoscaler/backend-hpa 는 k8s/backend/hpa.yaml 에 별도로 정의되어
  # 있으며, 아래 resources.requests.cpu 는 Metrics Server 가 준비되면 CPU 사용률
  # 기반 HPA 가 동작할 수 있도록 반드시 지정해 둔 값이다.
  # HPA 적용 이후 실제 replica 수는 HPA controller 가 소유한다.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devflow
    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: false
      # Private GitLab Registry. Secret/gitlab-registry-secret 은 별도 경로로
      # 생성한다(k8s/registry/image-pull-secret.example.yaml 참고). 자격증명은
      # Git 에 저장하지 않는다.
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
        kubernetes.io/os: linux
      # required 가 아닌 preferred 분산이므로, 스케줄 가능한 Node 가 하나뿐이어도
      # 스케줄링은 성공한다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
      # 종료 동작 - frontend 설정을 그대로 복사한 것이 아니라 확인 후 결정했다.
      # 이 애플리케이션은 Spring Boot graceful shutdown 을 활성화하지 않았다
      # (application*.yml 에 `server.shutdown: graceful` 없음). 따라서 SIGTERM 시
      # JVM 이 즉시 연결 수신을 중단한다. JVM 종료에는 30초면 충분하며, 아래의
      # 짧은 preStop 은 ALB target deregistration 시간을 벌기 위한 것이다.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: <BACKEND_IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 두 소스의 key 는 모두 애플리케이션이 실제로 읽는 변수다.
          # ConfigMap: SPRING_PROFILES_ACTIVE, SERVER_PORT, DB_URL, JWT_EXPIRATION
          # Secret   : DB_USERNAME, DB_PASSWORD, JWT_SECRET
          # 두 key 집합이 서로 겹치지 않으므로 덮어쓰기 모호성이 없다.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            # 이미지의 ENTRYPOINT 가 `java -jar app.jar` 로 고정되어 있어
            # JAVA_OPTS 를 받을 수 없고, Dockerfile 과 build.gradle 어디에도 heap
            # 관련 flag 가 없다. JAVA_TOOL_OPTIONS 는 JVM 자체의 표준 진입점이므로
            # 이미지를 바꾸지 않고 heap 크기를 지정할 수 있는 유일한 방법이다.
            # MaxRAMPercentage 기본값은 25%(1Gi limit 중 약 256Mi)이며, 60%
            # (약 614Mi)로 두면 limit 을 더 잘 활용하면서도 metaspace, code cache,
            # thread, direct buffer 여유를 남겨 OOMKill 을 피할 수 있다. 실제
            # 메모리 지표가 확보되면 조정하거나 제거한다.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseContainerSupport"
          # probe 는 실제로 존재하는 Actuator probe endpoint 를 사용한다.
          #   application.yml:36-46 이 health probe(liveness/readiness 그룹)를
          #   활성화하고, SecurityConfig.java:48 이 /actuator/health/** 를 허용한다.
          # backend/README.md:367-377 과 docs/architecture.md:119-121 에도
          # Kubernetes 용으로 문서화되어 있다. 없는 endpoint 를 만들지 않았다.
          #
          # startupProbe 가 JVM + Spring context + Hikari/JPA 기동 시간을 흡수하므로
          # 기동이 느린 상황을 liveness 실패로 오인하지 않는다.
          # 5초 * 36 = 컨테이너 재시작 전까지 최대 180초.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness 에는 DB 상태(readinessState + Hikari health)가 포함된다.
          # 그래서 DB 장애 시 Pod 를 Service 에서 제외해야 하며 재시작시키면
          # 안 된다(docs/architecture.md:121).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # docs/architecture.md:128 (Backend CPU 250m/1000m, Memory 512Mi/1Gi).
          # 이후 CPU 기반 HPA 를 위해 requests.cpu 는 필수다.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # 이미지가 실제로 지원하는 범위로 hardening 을 제한했다.
          #   * allowPrivilegeEscalation / privileged false -> 안전
          #   * capabilities.drop ALL -> 안전. 포트 8080 은 비특권 포트이며 JVM 은
          #     Linux capability 를 필요로 하지 않는다
          #   * seccompProfile RuntimeDefault -> 안전
          # 의도적으로 설정하지 않은 항목:
          #   * runAsNonRoot / runAsUser - backend/Dockerfile 에 USER 지시어가
          #     없어 이미지가 root 실행 전제로 만들어져 있고, 다른 UID 에서의
          #     app.jar 소유권/권한이 검증되지 않았다. 여기서 UID 를 강제하는 것은
          #     추측이다. 올바른 해결은 애플리케이션 측에서 backend/Dockerfile 에
          #     non-root USER 를 추가한 뒤 여기에 runAsNonRoot: true 를 켜는 것이다.
          #   * readOnlyRootFilesystem - 내장 Tomcat 과 JVM 이 java.io.tmpdir
          #     (/tmp, 예: hsperfdata, multipart 임시 파일)에 write 한다. 적용하려면
          #     /tmp 에 emptyDir 을 mount 하고 다시 테스트해야 한다.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # JVM 이 연결 수신을 멈추기 전에 ALB target group 이 이 Pod IP 를
          # deregister 할 수 있도록 짧은 drain 시간을 준다. 이 애플리케이션에
          # graceful shutdown 이 없기 때문에 특히 필요하다. Ubuntu 기반
          # eclipse-temurin:21-jre 이미지이므로 /bin/sh 와 sleep 이 존재한다.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
