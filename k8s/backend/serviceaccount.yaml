# ServiceAccount/backend-sa  (Namespace: devflow)
#
# Backend 는 Spring Boot REST API 다(backend/src/main/java/com/devflow).
# 소스를 확인한 결과 JDBC 로 PostgreSQL(RDS)과 통신하고 HTTP 를 서빙할 뿐이다.
# backend/build.gradle 에 AWS SDK 의존성이 없고 Kubernetes client 사용도 없다.
# 따라서 다음을 사용하지 않는다.
#   * IRSA 없음              (eks.amazonaws.com/role-arn annotation 없음)
#   * AWS IAM Role 없음, static AWS 자격증명 없음
#   * Role / RoleBinding 없음 (Kubernetes API 권한 자체가 없음)
# docs/architecture.md:135 ("backend-sa: Kubernetes API 권한 없음")와 일치한다.
#
# automountServiceAccountToken: false
#   backend/ 어디에서도 /var/run/secrets/kubernetes.io/serviceaccount 를 읽지
#   않으므로 projected token 을 제거해도 기능 손실이 없다. DB 자격증명은
#   Secret/backend-secret 의 환경변수로 전달되며 API server 를 거치지 않는다.
#   참고: 이후 Prometheus 가 /actuator/prometheus 를 scrape 하도록 구성하더라도,
#   그것은 Prometheus 가 API server 에 인증하고 Pod 를 scrape 하는 것이지 이 Pod
#   내부에 token 이 필요한 것은 아니다. 따라서 이 설정은 그대로 유효하다.
#
# 중복 정의 주의
#   docs/kubernetes_resource_list.md 는 ServiceAccount 위치로
#   k8s/rbac/serviceaccounts.yaml 을 제시하지만, backend-sa 는 이 파일이
#   소유한다(backend manifest 소속). k8s/frontend/ 의 frontend-sa 와 같은 방식이다.
#   따라서 해당 파일은 gitlab-deployer 만 담당해야 하며 backend-sa 나
#   frontend-sa 를 다시 정의하면 안 된다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: devflow
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
