# ServiceAccount/gitlab-deployer  (Namespace: devflow)
#
# 이 파일은 ServiceAccount 를 정확히 하나만 정의한다.
#   frontend-sa 는 k8s/frontend/serviceaccount.yaml 이 소유한다
#   backend-sa  는 k8s/backend/serviceaccount.yaml 이 소유한다
# 여기서는 의도적으로 다시 정의하지 않는다. 같은 객체를 두 manifest 가 소유하면
# `kubectl apply` 순서가 결과를 좌우하게 되고(그리고 automountServiceAccountToken:
# false 설정이 조용히 사라질 수 있다).
#
# 목적
#   GitLab CI/CD 가 devflow Namespace 에 새 컨테이너 이미지를 배포할 때 사용하는
#   identity 다. 권한은 다음 파일에 있다.
#     k8s/rbac/gitlab-deployer-role.yaml        (Role, Namespace 범위)
#     k8s/rbac/gitlab-deployer-rolebinding.yaml (RoleBinding)
#   cluster-admin 없음, ClusterRole 없음, 내장 admin/edit 바인딩 없음.
#
# 의도적으로 넣지 않은 것
#   * eks.amazonaws.com/role-arn / IRSA - CI 에 필요한 것은 Kubernetes API 이지
#     AWS API 가 아니다. 이미지 push 는 이미 CI 변수의 GitLab Registry
#     자격증명을 사용한다.
#   * AWS access key, GitLab PAT, registry password - Git 에 두지 않는다.
#   * 장기 ServiceAccount token Secret(kubernetes.io/service-account-token).
#     Kubernetes 1.24 이상에서는 자동 생성되지 않으며, 만료 없는 API token 을
#     CI 용으로 만들어 두는 것은 명백히 잘못된 패턴이다.
#
# CI 인증 방법 (실제 EKS/GitLab 연동 단계에서 결정)
#   선호 순서:
#     1. GitLab Agent for Kubernetes(agentk) - pull 방식, static token 불필요
#     2. 필요할 때마다 단기 token 발급:
#          kubectl -n devflow create token gitlab-deployer --duration=1h
#     3. 최후의 수단으로 수동 생성한 bound token Secret. 이 경우에도 값은 GitLab
#        masked/protected CI 변수에만 저장하고 저장소에는 절대 두지 않는다.
#   이 SA 는 Pod 에 mount 되는 것이 아니라 클러스터 외부(kubeconfig)에서
#   사용되므로 automountServiceAccountToken 은 기본값으로 둔다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer
  namespace: devflow
  labels:
    app.kubernetes.io/name: gitlab-deployer
    app.kubernetes.io/component: ci-deployer
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
